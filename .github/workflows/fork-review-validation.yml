name: Fork review validation
on:
  push:
    branches:
      - 'review/pr-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/review/pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-22, node-24, bun]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node-22' && '22' || '24' }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Runtime and commit
        run: |
          git rev-parse HEAD
          node --version
          if command -v bun >/dev/null; then bun --version; fi
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Node regressions
        if: matrix.runtime != 'bun'
        shell: bash
        run: |
          mapfile -d '' tests < <(find src -name '*.test.ts' -print0)
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test "${tests[@]}"
      - name: Bun regressions
        if: matrix.runtime == 'bun'
        shell: bash
        run: |
          # The Node HTTP adapter suite is covered by both Node jobs.
          # Bun uses the separate native bunServer.test.ts suite.
          echo 'Runtime split: src/server/clientIsolation.test.ts runs on Node 22 and 24.'
          mapfile -d '' tests < <(find src -name '*.test.ts' ! -path 'src/server/clientIsolation.test.ts' -print0)
          test "${#tests[@]}" -gt 0
          bun test --timeout 30000 "${tests[@]}"
      - name: Compiled output diff
        if: matrix.runtime == 'node-24'
        run: git diff --stat -- dist
      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'node-24'
        with:
          name: rebuilt-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
  publish-compiled-review:
    needs: validate
    if: github.repository == 'SebasLoadJs/NodeLink' && startsWith(github.ref, 'refs/heads/review/pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Rebuild validated source
        run: |
          npm run type-check
          npm run build
      - name: Commit only generated JavaScript for review changes
        shell: bash
        env:
          REVIEW_REF: ${{ github.ref }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          case "$REVIEW_REF" in
            refs/heads/review/pr-265) base=6746d157a5875b0b95332a57d7fe7229343785e6 ;;
            refs/heads/review/pr-266) base=51f93dfa4f53110aa506075869d6be3d9e2b4eb9 ;;
            refs/heads/review/pr-267) base=9da45ebc4d390c595e645be180328f2d9cff893b ;;
            refs/heads/review/pr-268) base=2a0e6211e72767651fa777a4e67471066bf5ff9b ;;
            refs/heads/review/pr-269) base=fa1659c6cb12953b6b6bdf3fc24f80779a689468 ;;
            refs/heads/review/pr-270) base=e96ae5ac944a94a903cdb91cc3fc00b66290dba3 ;;
            *) exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" HEAD
          while IFS= read -r -d '' file; do
            case "$file" in
              *.test.ts|*.d.ts) continue ;;
              src/*.ts)
                output="dist/${file%.ts}.js"
                test -f "$output"
                node --check "$output"
                git add -f -- "$output"
                ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACM "$base" HEAD -- src)
          if git diff --cached --quiet; then
            echo "Compiled output already current"
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          HUSKY=0 git commit -m 'build(review): regenerate validated JavaScript'
          # Fast-forward only, never force or update a feature/PR branch.
          git push origin "HEAD:$REVIEW_REF"
