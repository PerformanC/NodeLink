name: Probe public music metadata
on:
  push:
    branches: [feat/rich-media-metadata]
    paths: ['.github/workflows/probe-public-media.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public metadata without credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const probes = [
            ['Tidal GraphQL track', 'https://gqlapi.tidal.com', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'query ($trackId: BigInt!, $countryCode: String!) { track(id: $trackId, countryCode: $countryCode) { id title duration artists { id name } album { id title } image { original large medium small xsmall } } }',variables:{trackId:20115564,countryCode:'US'}})}],
            ['Tidal embed', 'https://embed.tidal.com/tracks/20115564',{}],
            ['Qobuz store', 'https://www.qobuz.com/us-en/album/edna-martinez-presents-pico-sound-system-culture-from-the-colombian-caribbean-various-artists/vft3hpnx5c3lc',{}],
          ];
          await Promise.all(probes.map(async ([name,url,options]) => {
            try {
              const response=await fetch(url,{...options,signal:AbortSignal.timeout(12000)});
              const body=await response.text();
              const output={name,status:response.status,bytes:body.length};
              if(name.includes('GraphQL')){
                try { const j=JSON.parse(body); output.track=j.data?.track?.title; output.artist=j.data?.track?.artists?.map(a=>a.name); output.error=j.errors?.map(e=>e.message); } catch {output.json=false;}
              }else{
                output.title=body.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1];
                output.tidalArtist=body.includes('media-artist');
                output.albumSchema=body.includes('MusicAlbum');
                output.trackMarkers=new Set(body.match(/popinAddToCartBtnPlayerTrack\d+/g)||[]).size;
              }
              console.log(JSON.stringify(output));
            }catch(e){console.log(JSON.stringify({name,error:e.message,cause:e.cause?.code}));}
          }));
          JS
